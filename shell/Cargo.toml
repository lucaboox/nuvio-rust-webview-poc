[package]
name = "nuvio-rust-webview-poc"
version = "0.1.0-alpha.1"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
keyring = { version = "3.6", features = ["windows-native"] }
libloading = "0.8"
open = "5.3"
rayon = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4"] }
url = "2.5"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
tauri = { version = "2.11.5", features = ["image-png"] }
tauri-plugin-process = "2.3"
tauri-plugin-updater = "2.9"
tauri-plugin-dialog = "2"

[build-dependencies]
dotenvy = "0.15"
tauri-build = { version = "2.6.3", features = [] }
