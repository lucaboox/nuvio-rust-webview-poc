[package]
name = "nuvio-rust-webview-poc"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
dotenvy = "0.15"
http = "1.3"
include_dir = "0.7"
image = { version = "0.25", default-features = false, features = ["png"] }
keyring = { version = "3.6", features = ["windows-native"] }
libloading = "0.8"
mime_guess = "2.0"
open = "5.3"
rayon = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tao = "0.35.3"
uuid = { version = "1.18", features = ["v4"] }
url = "2.5"
wry = "0.55.1"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"
